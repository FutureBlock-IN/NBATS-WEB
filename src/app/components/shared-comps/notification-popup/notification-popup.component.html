<div class="pop-up-container">
    <div class="title-section">
        <h2>{{data.title}}</h2>
    </div>
    <div class="message-section">
        <div class="message">{{data.message}}</div>
    </div>
    <hr>
    <div class="button-section">
        <button (click)="closeDialog()" class="pop-up-btn">{{data.buttonName}}</button>
    </div>
</div>
